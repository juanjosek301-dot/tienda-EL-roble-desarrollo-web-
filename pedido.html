<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Realizar pedido | El roble</title>

    <link rel="stylesheet" href="style/styles.css">
</head>

<body>

    <header class="header">

        <nav class="nav">

            <a href="index.html" class="logo">
                🏪 El roble
            </a>

            <ul class="nav-links">

                <li>
                    <a href="productos.html">Catálogo</a>
                </li>

                <li>
                    <a href="sobre-nosotros.html">Sobre nosotros</a>
                </li>

                <li>
                    <a href="pedido.html">Realizar pedido</a>
                </li>

            </ul>

        </nav>

    </header>

    <main>

        <section class="pedido-header">

            <h1>Realizar pedido</h1>

            <p>
                Completa el siguiente formulario para realizar
                tu pedido en EL roble.
            </p>

        </section>

        <section class="pedido">

            <form id="formulario-pedido">

                <section class="datos-cliente">

                    <h2>Información del cliente</h2>

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                    >

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="text"
                        id="telefono"
                        name="telefono"
                        required
                    >

                    <label for="direccion">
                        Dirección de entrega
                    </label>

                    <input
                        type="text"
                        id="direccion"
                        name="direccion"
                        required
                    >

                </section>


                <section class="datos-pedido">

                    <h2>Información del pedido</h2>

                    <label for="producto">
                        Producto
                    </label>

                    <input
                        type="text"
                        id="producto"
                        name="producto"
                        required
                    >

                    <label for="cantidad">
                        Cantidad
                    </label>

                    <input
                        type="text"
                        id="cantidad"
                        name="cantidad"
                        required
                    >

                    <label for="valor">
                        Valor del pedido
                    </label>

                    <input
                        type="text"
                        id="valor"
                        name="valor"
                        required
                    >

                    <label for="pago">
                        Método de pago
                    </label>

                    <input
                        type="text"
                        id="pago"
                        name="pago"
                        required
                    >

                </section>

                <section class="observaciones">

                    <h2>Observaciones</h2>

                    <label for="observaciones">
                        Indicaciones adicionales
                    </label>

                    <textarea
                        id="observaciones"
                        name="observaciones"
                    ></textarea>

                </section>


                <button type="submit">
                    Realizar pedido
                </button>

            </form>

        </section>

    </main>

    <footer class="footer">
        <p>
            © 2026 Mercado La Esquina - Medellín, Colombia
        </p>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="js/app.js"></script>

</body>

</html>
